name: Build Afghan Chat Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "capacitor.config.json"
      - "google-services.json"
      - "vite.config.js"
      - ".github/workflows/android-apk.yml"

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
        timeout-minutes: 8
      - name: Build web app
        run: npm run build
        timeout-minutes: 5
      - name: Add Android project
        run: npx cap add android
        timeout-minutes: 5
      - name: Configure Firebase Android
        run: |
          test -f google-services.json
          mkdir -p android/app
          cp google-services.json android/app/google-services.json
          grep -q "com.google.gms:google-services" android/build.gradle || sed -i "/dependencies {/a\\        classpath 'com.google.gms:google-services:4.4.2'" android/build.gradle
          grep -q "com.google.gms.google-services" android/app/build.gradle || printf "\\napply plugin: 'com.google.gms.google-services'\\n" >> android/app/build.gradle
      - name: Sync Android project
        run: npx cap sync android
        timeout-minutes: 5
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        timeout-minutes: 15
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Afghan-Chat-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
