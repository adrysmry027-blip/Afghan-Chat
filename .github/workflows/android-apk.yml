name: Build Afghan Chat Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "capacitor.config.json"
      - "google-services.json"
      - "vite.config.js"
      - ".github/workflows/android-apk.yml"

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
        timeout-minutes: 8
      - name: Build web app
        run: npm run build
        timeout-minutes: 5
      - name: Add Android project
        run: npx cap add android
        timeout-minutes: 5
      - name: Set Afghan Chat launcher icon
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          for spec in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${spec%%:*}"
            size="${spec##*:}"
            mkdir -p "android/app/src/main/res/mipmap-${density}"
            convert public/afghan-chat-logo.svg -background none -resize "${size}x${size}^" -gravity center -extent "${size}x${size}" "android/app/src/main/res/mipmap-${density}/ic_launcher.png"
            cp "android/app/src/main/res/mipmap-${density}/ic_launcher.png" "android/app/src/main/res/mipmap-${density}/ic_launcher_round.png"
          done
      - name: Configure Android OAuth deep link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          match = re.search(r'<activity\b[^>]*android:name="[^"]*MainActivity"[^>]*>', content, re.S)
          if not match:
              raise SystemExit("MainActivity activity tag not found in AndroidManifest.xml")
          activity_tag = match.group(0)
          if "android:launchMode=" not in activity_tag:
              updated_tag = activity_tag[:-1] + ' android:launchMode="singleTask">'
              content = content[:match.start()] + updated_tag + content[match.end():]
              match = re.search(r'<activity\b[^>]*android:name="[^"]*MainActivity"[^>]*>', content, re.S)
          if 'android:scheme="afghanchat"' not in content:
              closing = content.find("</activity>", match.end())
              if closing < 0:
                  raise SystemExit("MainActivity closing tag not found")
              intent_filter = """
                    <intent-filter>
                        <action android:name="android.intent.action.VIEW" />
                        <category android:name="android.intent.category.DEFAULT" />
                        <category android:name="android.intent.category.BROWSABLE" />
                        <data android:scheme="afghanchat" android:host="auth" android:path="/callback" />
                    </intent-filter>
              """
              content = content[:closing] + intent_filter + content[closing:]
          manifest.write_text(content)
          PY
      - name: Configure Firebase Android
        run: |
          test -f google-services.json
          mkdir -p android/app
          cp google-services.json android/app/google-services.json
          grep -q "com.google.gms:google-services" android/build.gradle || sed -i "/dependencies {/a\\        classpath 'com.google.gms:google-services:4.4.2'" android/build.gradle
          grep -q "com.google.gms.google-services" android/app/build.gradle || printf "\\napply plugin: 'com.google.gms.google-services'\\n" >> android/app/build.gradle
      - name: Sync Android project
        run: npx cap sync android
        timeout-minutes: 5
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        timeout-minutes: 15
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Afghan-Chat-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

# Trigger a fresh Android build when this workflow definition is updated.
