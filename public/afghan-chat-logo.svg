<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">افغان چت</title><desc id="desc">نشان افغان چت با هواپیمای کاغذی، پرچم افغانستان، کوه‌های برفی و بنای تاریخی</desc>
